<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 Suena Jeopardy — Taller de Música</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --coral: #E8614D;
  --blue: #2D3A4A;
  --mint: #2EC4A0;
  --gold: #FFB627;
  --purple: #7C5CFC;
  --pink: #FF2D78;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a1a 100%);
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
}

/* HEADER */
.header {
  text-align: center;
  padding: 30px 20px 20px;
}
.header h1 {
  font-size: 2.8em;
  font-weight: 900;
  background: linear-gradient(90deg, var(--coral), var(--gold), var(--mint));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: none;
}
.header p { opacity: 0.6; font-size: 1em; margin-top: 4px; }

/* SCOREBOARD */
.scoreboard {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 10px 20px 20px;
  flex-wrap: wrap;
}
.team {
  text-align: center;
  min-width: 150px;
}
.team-name {
  font-weight: 800;
  font-size: 1.1em;
  cursor: pointer;
  padding: 4px 12px;
  border-radius: 8px;
  border: 2px solid rgba(255,255,255,0.2);
}
.team-name:hover { border-color: rgba(255,255,255,0.5); }
.team-score {
  font-size: 2.5em;
  font-weight: 900;
  margin-top: 4px;
}
.team:nth-child(1) .team-score { color: var(--coral); }
.team:nth-child(2) .team-score { color: var(--mint); }
.team:nth-child(3) .team-score { color: var(--gold); }
.team:nth-child(4) .team-score { color: var(--purple); }
.team:nth-child(5) .team-score { color: var(--mint); }
.team:nth-child(6) .team-score { color: var(--pink); }
.score-btns { margin-top: 6px; display: flex; gap: 6px; justify-content: center; }
.score-btns button {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  width: 32px; height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-weight: 700;
  font-size: 1em;
  transition: all 0.2s;
}
.score-btns button:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }

/* BOARD */
.board {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  padding: 10px 20px;
  max-width: 1200px;
  margin: 0 auto;
}
.category {
  background: linear-gradient(180deg, var(--blue), #1a2536);
  padding: 14px 8px;
  text-align: center;
  font-weight: 800;
  font-size: 0.85em;
  border-radius: 10px 10px 0 0;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  min-height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 3px solid;
}
.category:nth-child(1) { border-color: var(--coral); }
.category:nth-child(2) { border-color: var(--mint); }
.category:nth-child(3) { border-color: var(--gold); }
.category:nth-child(4) { border-color: var(--purple); }
.category:nth-child(5) { border-color: var(--pink); }
.category:nth-child(6) { border-color: var(--coral); }

.cell {
  background: linear-gradient(180deg, #1a2040, #0f1525);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 18px 8px;
  text-align: center;
  font-size: 1.6em;
  font-weight: 900;
  color: var(--gold);
  cursor: pointer;
  transition: all 0.3s;
  min-height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cell:hover { background: linear-gradient(180deg, #2a3060, #1a2040); transform: scale(1.05); box-shadow: 0 4px 20px rgba(255,180,40,0.2); }
.cell.used { opacity: 0.15; cursor: default; pointer-events: none; }

/* MODAL */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: linear-gradient(135deg, #1a1a3e, #0a0a2a);
  border: 2px solid;
  border-radius: 20px;
  padding: 40px;
  max-width: 700px;
  width: 100%;
  text-align: center;
  position: relative;
  animation: modalIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes modalIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.modal-cat { font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; margin-bottom: 8px; }
.modal-points { font-size: 3em; font-weight: 900; margin-bottom: 16px; }
.modal-question { font-size: 1.4em; line-height: 1.5; margin-bottom: 24px; font-weight: 600; }
.modal-answer {
  display: none;
  font-size: 1.3em;
  font-weight: 800;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  animation: answerReveal 0.5s ease;
}
@keyframes answerReveal { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.modal-answer.visible { display: block; }
.btn {
  padding: 12px 28px;
  border: none;
  border-radius: 12px;
  font-family: 'Nunito', sans-serif;
  font-size: 1em;
  font-weight: 700;
  cursor: pointer;
  margin: 4px;
  transition: all 0.2s;
}
.btn:hover { transform: translateY(-2px); }
.btn-reveal { background: var(--gold); color: #000; }
.btn-close { background: rgba(255,255,255,0.15); color: #fff; }
.btn-correct { background: var(--mint); color: #000; }
.btn-wrong { background: var(--coral); color: #fff; }

/* CONFETTI */
.confetti-piece {
  position: fixed;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  z-index: 2000;
  pointer-events: none;
  animation: confettiFall 2s ease-out forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .header h1 { font-size: 1.8em; }
  .board { grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 10px; }
  .category { font-size: 0.7em; padding: 10px 6px; min-height: 50px; }
  .cell { font-size: 1.2em; min-height: 50px; padding: 12px 6px; }
  .modal { padding: 24px; }
  .modal-question { font-size: 1.1em; }
}

/* FINAL ROUND */
.final-round {
  display: none;
  text-align: center;
  padding: 60px 20px;
}
.final-round.active { display: block; }
.final-round h2 { font-size: 2.5em; color: var(--gold); margin-bottom: 20px; }
.final-category { font-size: 1.5em; color: var(--coral); margin: 20px 0; font-weight: 700; }
.final-question { font-size: 1.3em; line-height: 1.6; max-width: 700px; margin: 20px auto; }
</style>
</head>

<script>

// ==========================================
// GAME LOGIC
// ==========================================
var scores = [0, 0, 0, 0, 0, 0];
var currentQ = null;

function buildBoard() {
  var board = document.getElementById('board');
  board.innerHTML = '';
  
  // Categories
  categories.forEach(function(cat, i) {
    var div = document.createElement('div');
    div.className = 'category';
    div.textContent = cat;
    div.style.borderColor = catColors[i];
    board.appendChild(div);
  });
  
  // Question cells (5 rows)
  for (var row = 0; row < 5; row++) {
    categories.forEach(function(cat, col) {
      var q = questions[cat][row];
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = '$' + q.points;
      cell.dataset.cat = col;
      cell.dataset.row = row;
      cell.onclick = function() { openQuestion(this); };
      board.appendChild(cell);
    });
  }
}

function openQuestion(cell) {
  if (cell.classList.contains('used')) return;
  var cat = parseInt(cell.dataset.cat);
  var row = parseInt(cell.dataset.row);
  var q = questions[categories[cat]][row];
  currentQ = { cell: cell, points: q.points };
  
  var modal = document.getElementById('modal');
  modal.style.borderColor = catColors[cat];
  document.getElementById('modalCat').textContent = categories[cat];
  document.getElementById('modalPoints').textContent = '$' + q.points;
  document.getElementById('modalPoints').style.color = catColors[cat];
  document.getElementById('modalQuestion').textContent = q.q;
  document.getElementById('modalAnswer').textContent = q.a;
  document.getElementById('modalAnswer').className = 'modal-answer';
  document.getElementById('modalBtns').innerHTML = '<button class="btn btn-reveal" onclick="revealAnswer()">🎵 Revelar Respuesta</button>';
  document.getElementById('modalOverlay').classList.add('active');
}

function revealAnswer() {
  document.getElementById('modalAnswer').classList.add('visible');
  document.getElementById('modalAnswer').style.background = 'rgba(46, 196, 160, 0.15)';
  document.getElementById('modalAnswer').style.color = '#2EC4A0';
  
  var btns = '<div style="margin-top:10px;">';
  btns += '<button class="btn btn-close" onclick="closeModal()">Cerrar</button>';
  btns += '</div>';
  document.getElementById('modalBtns').innerHTML = btns;
  
  currentQ.cell.classList.add('used');
  currentQ.cell.textContent = '✓';
  currentQ.cell.style.color = 'rgba(255,255,255,0.2)';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  currentQ = null;
}

function adjustScore(team, amount) {
  scores[team] += amount;
  document.getElementById('score-' + team).textContent = scores[team];
  if (amount > 0) miniConfetti();
}

function renameTeam(idx) {
  var current = document.querySelectorAll('.team-name')[idx].textContent;
  var newName = prompt('Nombre del equipo:', current);
  if (newName && newName.trim()) {
    document.querySelectorAll('.team-name')[idx].textContent = newName.trim();
  }
}

function miniConfetti() {
  var colors = ['#E8614D', '#2EC4A0', '#FFB627', '#7C5CFC', '#FF2D78'];
  for (var i = 0; i < 15; i++) {
    var piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random() * 100) + 'vw';
    piece.style.top = '-10px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 0.5) + 's';
    piece.style.animationDuration = (1.5 + Math.random()) + 's';
    document.body.appendChild(piece);
    setTimeout(function(p) { p.remove(); }.bind(null, piece), 3000);
  }
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Close on Escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// Build the board!
buildBoard();
</script>
